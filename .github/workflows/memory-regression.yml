name: Memory pipeline regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install CPU validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Check CLI and regression tests
        run: |
          python -m compileall -q inference_cli.py src tests tools
          python inference_cli.py --help
          python -m mypy
          python -m pytest -q tests
      - name: Check bounded output buffers
        run: python tools/benchmark_memory.py --frames 33 330 --output memory-baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: cpu-memory-baseline
          path: memory-baseline.json
