[project]
name = "seedvr2_videoupscaler"
description = "SeedVR2 command-line video and image upscaling for Linux CUDA"
version = "2.5.24"
requires-python = "==3.13.*"
authors = [
    {name = "numz"},
    {name = "adrientoupet"}
]
license = {file = "LICENSE"} 
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "safetensors",
    "numpy",
    "tqdm",
    "psutil",
    "einops",
    "omegaconf>=2.3.0",
    "diffusers==0.33.1",
    "rotary_embedding_torch>=0.5.3",
    "opencv-python",
    "gguf",
    "Pillow"
]

[project.urls]
Repository = "https://github.com/delvilo/SeedVR2Lite_VideoUpscaler"
Documentation = "https://github.com/delvilo/SeedVR2Lite_VideoUpscaler#readme"
"Bug Tracker" = "https://github.com/delvilo/SeedVR2Lite_VideoUpscaler/issues"

[tool.mypy]
follow_imports = "silent"
files = [
    "src/config.py", "src/cli", "src/media", "src/core/context.py",
    "src/core/pipeline.py", "src/core/planning.py", "src/core/scheduler.py",
    "src/core/session.py", "src/optimization/memory_budget.py"
]
